# =============================================================================
# EcoRadar Urbano — API Gateway (Nginx)
# Ponto único de entrada (porta 8080): roteia para os microsserviços, faz
# balanceamento round-robin entre as réplicas do ocorrencias-service, faz proxy
# do WebSocket (Socket.IO), gera/propaga o X-Request-Id e serve o app web.
# =============================================================================
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    # Padrão do Nginx é 1000 requisições por conexão keep-alive; sob carga contínua isso
    # fecha conexões de clientes no meio do teste (achado no teste de carga com autocannon).
    keepalive_requests 10000;

    # DNS interno do Docker: permite reresolver os nomes dos containers quando
    # uma réplica é reiniciada e recebe outro IP (parâmetro "resolve" abaixo).
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # ----- Correlação: reaproveita o X-Request-Id do cliente ou gera um novo ----
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Log em JSON com request-id e a réplica (upstream) que atendeu
    log_format ecoradar escape=json
        '{"time":"$time_iso8601","servico":"gateway","requestId":"$req_id",'
        '"cliente":"$remote_addr","metodo":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"upstream":"$upstream_addr",'
        '"tempoUpstream":"$upstream_response_time","tempo":$request_time}';
    access_log /dev/stdout ecoradar;

    # Fotos de até 5 MB + campos do formulário. Arquivos maiores que 5 MB são
    # recusados pelo próprio serviço (413 em JSON); acima de 8 MB o gateway recusa.
    client_max_body_size 8m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # ----- Upstreams -------------------------------------------------------------
    upstream auth_service {
        zone auth_service 64k;
        server auth-service:3000 resolve;
        keepalive 16;
    }

    # 2 réplicas, round-robin (padrão do Nginx). Se uma réplica falhar, ela é
    # marcada como indisponível por 5 s e as requisições vão para a outra.
    upstream ocorrencias_service {
        zone ocorrencias_service 64k;
        server ocorrencias-service-1:3000 resolve max_fails=1 fail_timeout=5s;
        server ocorrencias-service-2:3000 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    upstream ambiental_service {
        zone ambiental_service 64k;
        server ambiental-service:3000 resolve;
        keepalive 16;
    }

    upstream alertas_service {
        zone alertas_service 64k;
        server alertas-service:3000 resolve;
        keepalive 16;
    }

    upstream relatorios_service {
        zone relatorios_service 64k;
        server relatorios-service:3000 resolve;
        keepalive 16;
    }

    upstream sensor_simulator {
        zone sensor_simulator 64k;
        server sensor-simulator:3000 resolve;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        # Cabeçalhos repassados a todos os serviços
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-Id      $req_id;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Tolerância a falhas: se a réplica escolhida recusar a conexão ou
        # responder 502/503, tenta a próxima (POST só é repetido se a falha
        # ocorreu antes do envio — comportamento seguro padrão do Nginx).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Erros gerados pelo próprio gateway também saem em JSON
        proxy_intercept_errors off;
        error_page 413 = @arquivo_grande;
        error_page 502 503 504 = @indisponivel;

        # ----- Saúde do gateway -------------------------------------------------
        location = /health {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header X-Instance-Id gateway always;
            add_header X-Request-Id $req_id always;
            return 200 '{"status":"ok","servico":"gateway","instancia":"gateway"}';
        }

        # ----- Rotas da API -----------------------------------------------------
        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location /api/ocorrencias {
            proxy_pass http://ocorrencias_service;
        }

        location /uploads/ {
            proxy_pass http://ocorrencias_service;
            expires 7d;
        }

        location /api/ambiental/ {
            proxy_pass http://ambiental_service;
        }

        location /api/alertas {
            proxy_pass http://alertas_service;
        }

        location /api/relatorios/ {
            proxy_pass http://relatorios_service;
            proxy_read_timeout 60s;
        }

        location /api/simulador/ {
            proxy_pass http://sensor_simulator;
        }

        # ----- WebSocket (Socket.IO) do alertas-service -------------------------
        location /socket.io/ {
            proxy_pass http://alertas_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Request-Id      $req_id;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        # ----- App web (build exportado do Expo) ---------------------------------
        location / {
            root /usr/share/nginx/html/app;
            try_files $uri $uri.html /index.html =404;
            error_page 404 = @sem_app;
        }

        location @sem_app {
            root /usr/share/nginx/html/gateway;
            try_files /index.html =404;
        }

        location @arquivo_grande {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header X-Request-Id $req_id always;
            return 413 '{"erro":{"codigo":"ARQUIVO_MUITO_GRANDE","mensagem":"A requisição excede o tamanho máximo permitido pelo gateway.","requestId":"$req_id"}}';
        }

        location @indisponivel {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header X-Request-Id $req_id always;
            return 503 '{"erro":{"codigo":"SERVICO_INDISPONIVEL","mensagem":"O serviço está temporariamente indisponível. Tente novamente em instantes.","requestId":"$req_id"}}';
        }
    }
}
