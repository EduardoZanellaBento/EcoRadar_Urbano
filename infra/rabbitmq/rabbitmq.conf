# EcoRadar Urbano — configuração do RabbitMQ
# AMQP 0-9-1 na porta 5672 (eventos entre serviços) e MQTT na 1883 (telemetria dos sensores).
listeners.tcp.default = 5672
management.tcp.port = 15672

# ----- MQTT ---------------------------------------------------------------
# As mensagens MQTT são roteadas para a exchange amq.topic; o "/" do tópico
# MQTT vira "." na routing key AMQP (ecoradar/sensores/x/leituras -> ecoradar.sensores.x.leituras).
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic

# Limite de memória relativo (evita que o broker consuma toda a RAM da VM do Docker)
vm_memory_high_watermark.relative = 0.6
